name: Flutter CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes the running jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with .fvmrc: the SDK decides compileSdk and the targetSdk
  # floor, so an unpinned "stable" is a release variable.
  FLUTTER_VERSION: 3.47.2

jobs:
  check:
    name: Analyze, generated code, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Generated code is committed and current
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/l10n lib/data/local || {
            echo "::error::Generated files are stale. Run 'flutter gen-l10n' and 'dart run build_runner build' and commit." >&2
            exit 1
          }
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    name: Android release bundle
    runs-on: ubuntu-latest
    needs: check
    env:
      # Secrets are not readable in job-level `if`; expose presence as env.
      HAS_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Install upload keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          PROPS
      - name: Build app bundle (R8, obfuscated, split debug info)
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols
          --build-number=${{ github.run_number }}
      - name: Build APK for the 16 KB page-size check
        run: flutter build apk --release --target-platform android-arm64
      - name: 16 KB page alignment
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk > /dev/null \
            && echo "16 KB aligned" \
            || { echo "::error::APK is not 16 KB page aligned" >&2; exit 1; }
      - name: Report signing mode
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then echo "Signed with upload keystore";
          else echo "::warning::No UPLOAD_KEYSTORE_B64 secret: bundle is debug-signed and cannot be uploaded to Play"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols
          retention-days: 14
      # Sideloadable arm64 APK for device testing before a store upload.
      # Debug-signed unless the upload keystore secrets are present.
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: iOS build (no codesign)
    runs-on: macos-15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      # Compiles the Runner target and the PlatrareWidgets extension (Swift),
      # which nothing else builds outside the maintainer's machine.
      - run: flutter build ios --release --no-codesign
      - name: Release Info.plist has no debug-only network keys
        run: |
          PLIST=build/ios/iphoneos/Runner.app/Info.plist
          for KEY in NSBonjourServices NSLocalNetworkUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" >/dev/null 2>&1; then
              echo "::error::$KEY is present in the Release Info.plist" >&2; exit 1
            fi
          done
          echo "Release Info.plist is clean"
